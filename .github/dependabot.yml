version: 2
updates:
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    groups:
      hooks:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /.groundwork/scripts
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    groups:
      scripts:
        patterns: ["*"]
        exclude-patterns: ["ruff"]
      # A new version of Ruff can change the layout, and its pull request then needs a reformatting by hand (ADR 1005).
      lint:
        patterns: ["ruff"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ["*"]

  # The entries of the project go below this line. groundwork adds its own above it.
