name: checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

# An edit of the title or of the description starts a run of its own, in a group of its own: it does not cancel the run
# of a push, which would leave a cancelled run as the last one created, and a push does not cancel it. A new push still
# cancels the run of the previous push, and a new edit the previous edit.
concurrency:
  group: checks-${{ github.ref }}-${{ github.event.action == 'edited' && 'edit' || 'code' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PRE_COMMIT_VERSION: 4.7.0

jobs:
  groundwork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pre-commit
        run: pipx install "pre-commit==${PRE_COMMIT_VERSION}"

      # An environment of a hook is made with the interpreter that pre-commit runs with, which is the
      # one in the first line of its script (without its options), in its own environment of pipx. The key follows that
      # Python, whose version the log shows, the system, pre-commit and the configuration, and the hash
      # holds the folder of the environments too, since they hold absolute paths and are not moved.
      - name: Find the key of the cache of pre-commit
        id: key
        env:
          CONFIG_HASH: ${{ hashFiles('.pre-commit-config.yaml') }}
        run: |
          echo "PRE_COMMIT_HOME=$RUNNER_TEMP/pre-commit" >> "$GITHUB_ENV"
          python="$(head -n 1 "$(command -v pre-commit)" | cut -c 3- | cut -d ' ' -f 1)"
          "$python" -VV
          hash="$({ "$python" -VV; echo "$RUNNER_TEMP"; } | sha256sum | cut -d ' ' -f 1)"
          echo "key=pre-commit-${RUNNER_OS}-${PRE_COMMIT_VERSION}-${hash}-${CONFIG_HASH}" >> "$GITHUB_OUTPUT"

      # A pull request restores the environments that a push to the default branch saved, and the
      # cache it writes stays in its own scope (the merge ref), so it cannot change what the default
      # branch restores. There is no restore-keys: a cache of another configuration is not used.
      - name: Restore the environments of pre-commit
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PRE_COMMIT_HOME }}
          key: ${{ steps.key.outputs.key }}

      - name: Run every check
        run: pre-commit run --all-files --hook-stage manual

      # Saved even when a check failed, since the environments are installed by then. Nothing is
      # saved after a hit: the key does not change, so the entry stays as it is.
      - name: Save the environments of pre-commit
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PRE_COMMIT_HOME }}
          key: ${{ steps.key.outputs.key }}

      - name: Install the dependencies of the scripts
        run: |
          python3 -m venv "$RUNNER_TEMP/scripts"
          "$RUNNER_TEMP/scripts/bin/python" -m pip install -r .groundwork/scripts/requirements.txt

      # The coverage can change only with the scripts, their tests and their configuration, which are
      # under .groundwork/scripts, or with the steps below. A pull request that changes none of them
      # runs the plain tests, and a push to the main branch always measures.
      - name: Find whether the scripts changed
        id: scripts
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && git diff --quiet "origin/$BASE_REF"...HEAD -- .groundwork/scripts .github/workflows/checks.yml; then
            changed=false
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Find whether the repository is a source of ADRs
        id: kind
        env:
          SOURCE: ${{ hashFiles('.groundwork-version') == '' || vars.GROUNDWORK_SOURCE == 'true' }}
        run: |
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"

      # A source of ADRs lints and formats the Python of its scripts (ADR 1005). A project gets the scripts
      # through the update and runs neither, whatever the scripts changed.
      - name: Lint and format the scripts
        if: ${{ steps.kind.outputs.source == 'true' }}
        run: |
          "$RUNNER_TEMP/scripts/bin/python" -m ruff check --config .groundwork/scripts/ruff.toml .groundwork/scripts
          "$RUNNER_TEMP/scripts/bin/python" -m ruff format --check --config .groundwork/scripts/ruff.toml .groundwork/scripts

      # A source of ADRs, such as a community base, sets the variable GROUNDWORK_SOURCE to true in the
      # settings of its repository, to run the test of the trees that its projects get too. A source
      # also measures the coverage of its scripts by their tests and requires a minimal level (the
      # threshold is in coveragerc), when the scripts changed. A project that left ADRs out has fewer
      # scripts and tests, so it runs the plain tests.
      - name: Test the scripts and measure the coverage
        if: ${{ steps.kind.outputs.source == 'true' && steps.scripts.outputs.changed == 'true' }}
        env:
          GROUNDWORK_SOURCE: ${{ vars.GROUNDWORK_SOURCE }}
        run: |
          "$RUNNER_TEMP/scripts/bin/python" -m coverage run --rcfile=.groundwork/scripts/coveragerc -m unittest discover -s .groundwork/scripts -p 'test_*.py'
          "$RUNNER_TEMP/scripts/bin/python" -m coverage combine --rcfile=.groundwork/scripts/coveragerc
          "$RUNNER_TEMP/scripts/bin/python" -m coverage report --rcfile=.groundwork/scripts/coveragerc

      # A project gets its scripts through the update (ADR 0014), and the source has already run their
      # tests on the same version. So a project runs all the tests only when the scripts or this
      # workflow changed, which includes the update pull request and a push to the main branch:
      # all the tests run where the repository is a source or the scripts changed, but not both (the
      # measure then runs them), and the tests of the configuration run in neither case.
      - name: Test the scripts
        if: ${{ steps.kind.outputs.source != steps.scripts.outputs.changed }}
        env:
          GROUNDWORK_SOURCE: ${{ vars.GROUNDWORK_SOURCE }}
        run: |
          "$RUNNER_TEMP/scripts/bin/python" -m unittest discover -s .groundwork/scripts -p 'test_*.py'

      # Otherwise a project runs the tests that read the files of the repository, which it edits: the
      # workflows, the checks, the map of the practices. A pattern of -k matches the name of a test, and
      # a project that left a practice out has not all the modules, so a missing one is no error.
      # A test module that reads a file of the repository (it defines ROOT, builds a path up with
      # "..", "..", or uses the working directory) goes in this list, and a test checks it.
      - name: Test the configuration of the project
        if: ${{ steps.kind.outputs.source != 'true' && steps.scripts.outputs.changed != 'true' }}
        env:
          GROUNDWORK_SOURCE: ${{ vars.GROUNDWORK_SOURCE }}
        run: |
          "$RUNNER_TEMP/scripts/bin/python" -m unittest discover -s .groundwork/scripts -p 'test_*.py' \
            -k 'test_apply_choice_on_the_real_files.' \
            -k 'test_checks_workflow.' \
            -k 'test_codeowners_template.' \
            -k 'test_entries_of_the_project.' \
            -k 'test_filtered_trees.' \
            -k 'test_pre_commit_config.' \
            -k 'test_release.Workflow.' \
            -k 'test_script_dependencies.' \
            -k 'test_shared_files.' \
            -k 'test_update_workflow.'

      # Dependabot starts the title of its pull requests with a capital letter (ADR 0003). The
      # branch is not enough to be skipped, since anyone can name a branch dependabot/…
      - name: Check the pull request title
        if: ${{ !cancelled() && github.event_name == 'pull_request' && !(startsWith(github.head_ref, 'dependabot/') && github.event.pull_request.user.login == 'dependabot[bot]') }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/title.txt"
          pre-commit run commit-title --hook-stage commit-msg --commit-msg-filename "$RUNNER_TEMP/title.txt"

      - name: Check the branch name and the closing line of the pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BRANCH: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
          BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 .groundwork/scripts/check_pull_request.py "$BRANCH" "$BASE" "$BODY" "$PR_TITLE"

  # The checks of the project, in a workflow that it owns and that groundwork does not change again.
  project:
    uses: $/.github/workflows/project-checks.yml

  # The ruleset requires this job only. It runs even when a job it waits for failed or was skipped, since the
  # platform counts a skipped job as a success, but not when the run is cancelled, and it fails unless both succeeded.
  checks:
    needs: [groundwork, project]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the checks of groundwork and of the project
        env:
          GROUNDWORK: ${{ needs.groundwork.result }}
          PROJECT: ${{ needs.project.result }}
        run: '[ "$GROUNDWORK" = success ] && [ "$PROJECT" = success ]'
