name: checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PRE_COMMIT_VERSION: 4.7.0

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pre-commit
        run: pipx install "pre-commit==${PRE_COMMIT_VERSION}"

      - name: Run every check
        run: pre-commit run --all-files --hook-stage manual

      - name: Install the dependencies of the scripts
        run: |
          python3 -m venv "$RUNNER_TEMP/scripts"
          "$RUNNER_TEMP/scripts/bin/python" -m pip install -r .github/scripts/requirements.txt

      - name: Test the scripts
        run: |
          "$RUNNER_TEMP/scripts/bin/python" -m unittest discover -s .github/scripts -p 'test_*.py'

      # Dependabot starts the title of its pull requests with a capital letter (ADR 0003).
      - name: Check the pull request title
        if: ${{ !cancelled() && github.event_name == 'pull_request' && !startsWith(github.head_ref, 'dependabot/') }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/title.txt"
          pre-commit run commit-title --hook-stage commit-msg --commit-msg-filename "$RUNNER_TEMP/title.txt"

      - name: Check the branch name and the closing line of the pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BRANCH: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
          BODY: ${{ github.event.pull_request.body }}
        run: python3 .github/scripts/check_pull_request.py "$BRANCH" "$BASE" "$BODY"
